<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="plate" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ffa257"/>
      <stop offset="0.45" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#d4300c"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8320c"/>
      <stop offset="1" stop-color="#5e1a05"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e4df"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <circle cx="262" cy="248" r="230" fill="url(#glow)"/>

  <!-- speed lines -->
  <g stroke="#ff5a1f" stroke-linecap="round">
    <line x1="44" y1="206" x2="100" y2="206" stroke-width="16" stroke-opacity="0.95"/>
    <line x1="62" y1="250" x2="96" y2="250" stroke-width="16" stroke-opacity="0.7"/>
    <line x1="52" y1="294" x2="92" y2="294" stroke-width="16" stroke-opacity="0.45"/>
  </g>

  <!-- shadow on the floor -->
  <ellipse cx="282" cy="438" rx="150" ry="24" fill="#000" opacity="0.55" filter="url(#soft)"/>

  <!-- plate: extruded side, then the face -->
  <circle cx="284" cy="268" r="158" fill="url(#side)"/>
  <circle cx="268" cy="252" r="158" fill="url(#plate)"/>
  <circle cx="268" cy="252" r="156" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <!-- raised inner ring -->
  <circle cx="268" cy="252" r="118" fill="none" stroke="#b5300c" stroke-opacity="0.55" stroke-width="12"/>
  <circle cx="266" cy="249" r="112" fill="none" stroke="#ffc08f" stroke-opacity="0.55" stroke-width="3"/>

  <!-- the G: deep shadow, then the raised letter with a top highlight -->
  <path d="M325 199 A80 80 0 1 0 348 252 L 278 252" fill="none" stroke="#6a1d06" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" transform="translate(9 10)"/>
  <path d="M325 199 A80 80 0 1 0 348 252 L 278 252" fill="none" stroke="url(#letter)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M311 186 A80 80 0 0 0 196 214" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- spark -->
  <path d="M424 92 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9 z" fill="#ffffff"/>
</svg>
