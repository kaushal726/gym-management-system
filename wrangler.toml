# GymDesk on Cloudflare's free plan.
#  - The public site and API run on Cloudflare Pages (pages/wrangler.toml): https://gymdeskapp.pages.dev
#  - This Worker runs the hourly cron (reminders, push queue) and redirects its old workers.dev address to Pages.
#  - Locally, `wrangler dev` with this file serves the API (and the built files) for the Vite dev server.
# Keep [vars] and the D1 binding the same in both files: scripts/check-config.mjs fails the deploy if they differ.
name = "gym-management-system"
main = "worker/src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker sees every request so it can redirect the old address to PUBLIC_URL.
run_worker_first = true

# At :30 past every hour UTC, which is on the hour in India. Each gym runs once a day at its own reminder hour;
# the other runs only send pushes that did not fit in the earlier ones.
[triggers]
crons = ["30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "gym-management-system"
database_id = "8e0f6de2-6519-4a7a-a6fd-4a173a90a9d9"
migrations_dir = "worker/migrations"

[vars]
PUBLIC_URL = "https://gymdeskapp.pages.dev"
# Google Cloud Console > APIs & Services > Credentials > OAuth client ID (Web). Public value.
GOOGLE_CLIENT_ID = "606855341495-7ejam7rdcd8ulijffsiv1gk4fb4865ni.apps.googleusercontent.com"
VAPID_PUBLIC_KEY = "BCkSqtcIqWkAuSFMeDfeOuZmvVjHwjDL6ahPPJ9BD43M8wro_SEwcryEgjH93g6u8aCWHqhN0HAwbprHUJ_Php0"
VAPID_SUBJECT = "https://gymdeskapp.pages.dev"
ALLOW_GYM_SIGNUP = "0"
# Secrets (never committed), set on both the Worker and the Pages project: VAPID_PRIVATE_JWK, PLATFORM_ADMIN_EMAILS
